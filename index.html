<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나우의 심부름 장보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261105-editor">
</head>
<body>
<header class="top">
  <button type="button" class="brand" id="btn-home" aria-label="나우의 심부름 장보기 첫 화면으로"><span class="shop-cart" aria-hidden="true">🛒</span><span class="brand-title">나우의 심부름 장보기</span> <span class="hint" id="level-label"></span></button>
  <div class="header-tools"><div class="timer-wrap hidden" id="timer-wrap"><span aria-hidden="true">⏱️</span><span>풀이 시간</span><time id="solve-timer" role="timer" aria-label="풀이 시간">00:00.0</time></div><button class="wood-new-map" id="btn-new-map" aria-label="새 맵"><svg aria-hidden="true" viewBox="0 0 32 32"><path d="M16 2 29 9v15l-13 7L3 24V9Z" fill="#eee9da" stroke="#302a29" stroke-width="2"/><path d="m3 9 13 7 13-7M16 16v15" fill="none" stroke="#70665a"/><g fill="#3d3936"><circle cx="16" cy="8" r="2"/><circle cx="9" cy="17" r="1.7"/><circle cx="11" cy="23" r="1.7"/><circle cx="22" cy="17" r="1.7"/><circle cx="24" cy="23" r="1.7"/></g></svg><span>새 맵</span></button></div>
</header>

<main>
<!-- ============ 장면 1: 인트로 ============ -->
<section id="scene-intro" class="intro">
  <div class="intro-start">
    <div class="intro-art">
      <img src="assets/shopping-pixel-title.webp" width="1672" height="941" alt="나우의 심부름 장보기. 장바구니를 들고 마트로 향하는 도트 캐릭터 나우" fetchpriority="high">
    </div>
    <div class="intro-menu">
    <h1 class="visually-hidden">나우의 심부름 장보기</h1>
    <div id="level-picker-wrap" class="picker-wrap">
      <h2 class="visually-hidden" id="level-picker-title">난이도 고르기</h2>
      <div class="level-picker" id="level-picker" role="group" aria-labelledby="level-picker-title"></div>
    </div>
    <button class="btn big" id="btn-start">▶ 시작하기</button>
    </div>
  </div>
</section>

<!-- ============ 장면 2+3: 코딩 / 실행 ============ -->
<section id="scene-play" class="play hidden">
  <div class="panel">
    <div class="map-toolbar hidden"><span id="map-label">초1–3</span></div>
    <div class="grid-wrap">
      <div class="grid" id="grid" aria-label="마트 지도"></div>
      <div class="failure-overlay hidden" id="failure-overlay" role="status" aria-live="polite" aria-atomic="true">
        <div class="failure-card">
          <div class="event-props" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="event-emoji" id="event-emoji" aria-hidden="true"></div>
          <b id="event-title"></b>
          <span id="event-caption"></span>
        </div>
      </div>
    </div>
    <div class="shopping-card shopping-panel">
      <h2>심부름 목록</h2>
      <div class="recipe" id="recipe"></div>
    </div>
  </div>

  <div class="sticker workspace">
    <h2>🧩 블록 코딩 <span class="hint" id="block-count">블록 0개</span></h2>
    <div class="blockly-frame">
      <div id="blocklyDiv"></div>
      <div class="editor-zoom" role="group" aria-label="블록 화면 크기">
        <button type="button" id="zoom-in" aria-label="확대" title="확대">+</button>
        <button type="button" id="zoom-out" aria-label="축소" title="축소">−</button>
        <button type="button" id="zoom-reset" aria-label="기본 크기" title="기본 크기">=</button>
      </div>
      <div class="ws-lock" id="ws-lock"></div>
    </div>
    <div class="controls">
      <button type="button" class="btn ghost" id="btn-preview">미리보기</button>
      <button class="btn" id="btn-run">▶ 실행</button>
      <button class="btn ghost" id="btn-stop" disabled>■ 멈춤</button>
      <button class="btn ghost" id="btn-clear">🧹 블록 지우기</button>
    </div>
  </div>
</section>

<!-- ============ 장면 4: 결과 ============ -->
<section id="scene-result" class="result hidden">
  <div class="sticker verdict result-hero">
    <div class="big" id="res-emoji">🎉</div>
    <div class="verdict-copy">
      <h2 id="res-title">심부름 결과</h2>
      <p id="res-story" class="hidden"></p>
      <div id="res-ending-caption" class="ending-caption hidden"></div>
    </div>
    <div class="result-totals">
      <div class="result-score-wrap">
        <span class="metrics-label">점수</span>
        <div class="score"><span id="res-score">0</span><small><span id="res-max"></span></small></div>
      </div>
      <div class="result-clock"><span class="metrics-label">풀이 시간</span><b id="res-time">00:00.0</b></div>
    </div>
  </div>

  <div class="result-body">
    <section class="sticker result-review">
      <div class="review-heading"><h2>🗺️ 이번 장보기</h2></div>
      <div class="review-layout">
        <section class="route-card" aria-label="이동 경로">
          <div class="result-map-wrap"><div id="result-grid" class="grid result-grid" aria-label="이번 장보기 이동 경로"></div></div>
          <div id="route-summary" class="route-summary"></div>
        </section>
        <div class="review-details">
          <section class="shopping-card">
            <h3>심부름 목록</h3>
            <div class="recipe" id="res-shopping-list"></div>
          </section>
          <div class="stats">
            <div class="stat"><b id="res-blocks">0</b><span>블록 수</span></div>
            <div class="stat"><b id="res-actions">0</b><span>동작 수</span></div>
            <div class="stat"><b id="res-extras">0</b><span>추가 물건</span></div>
            <div class="stat"><b id="res-bumps">0</b><span>벽에 쿵</span></div>
            <div class="stat"><b id="res-traps">0</b><span>함정 감점</span></div>
          </div>
          <div class="table-wrap" tabindex="0" role="region" aria-label="물건별 점수">
            <table class="breakdown"><thead><tr><th>물건</th><th>판정</th><th class="pts">점수</th></tr></thead><tbody id="res-rows"></tbody></table>
          </div>
        </div>
      </div>
    </section>
    <section class="sticker hof">
      <div class="hof-heading"><h2>🏅 명예의 전당</h2><button class="btn ghost" id="btn-name-entry">이름 등록</button></div>
      <p class="hof-status" id="hof-status" role="status"></p>
      <ol id="hof-list" tabindex="0" aria-label="순위"></ol>
    </section>
  </div>
  <footer class="result-footer actions">
    <button class="btn" id="btn-retry">🔄 다시 도전 (블록 유지)</button>
    <button class="btn ghost" id="btn-restart">처음으로</button>
  </footer>
</section>
</main>
<dialog class="preview-dialog" id="preview-dialog" aria-labelledby="preview-title">
  <div class="preview-heading">
    <h2 id="preview-title">마트 미리보기</h2>
    <button type="button" class="btn ghost" id="btn-preview-close">닫기</button>
  </div>
  <div id="preview-content"></div>
</dialog>
<dialog class="name-dialog" id="name-dialog" aria-labelledby="name-title" aria-describedby="name-summary">
  <form id="name-form" novalidate>
    <div class="name-dialog-icon" aria-hidden="true">🏅</div>
    <h2 id="name-title">이름을 알려줘!</h2>
    <p id="name-summary"></p>
    <label for="player-name">이름 또는 별명</label>
    <input id="player-name" name="name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="어떤 이름으로 남길까요?" required>
    <p id="name-error" class="name-error hidden" role="alert"></p>
    <p id="name-status" class="name-status" role="status"></p>
    <div class="name-dialog-actions">
      <button class="btn" id="name-submit" type="submit">등록하고 결과 보기</button>
      <button class="btn ghost" id="name-skip" type="button">건너뛰기</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script src="vendor/blockly.min.js"></script>
<script src="vendor/blockly_ko.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js?v=20261105-editor"></script>
</body>
</html>
